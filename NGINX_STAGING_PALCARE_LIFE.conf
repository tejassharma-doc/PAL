# Nginx configuration for the STAGING stack
# Domain: staging.palcare.life
#
# Install alongside the prod config (do NOT replace it):
#   sudo cp NGINX_STAGING_PALCARE_LIFE.conf /etc/nginx/sites-available/staging.palcare.life
#   sudo ln -s /etc/nginx/sites-available/staging.palcare.life /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d staging.palcare.life        # issue the cert first (or use the HTTP block below)
#   sudo nginx -t && sudo systemctl reload nginx
#
# Point a DNS A record `staging.palcare.life` at this server before issuing the cert.
#
# Ports map to the STAGING compose stack (see .env.staging.example):
#   web 3012 · api 8011 · mcp-api 3013 · fastmcp 8012 · flower 5556 · mdt 8091

# Redirect HTTP → HTTPS (also serves the ACME challenge for certbot)
server {
    listen 80;
    listen [::]:80;
    server_name staging.palcare.life;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.palcare.life;

    ssl_certificate /etc/letsencrypt/live/staging.palcare.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.palcare.life/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # A visible marker + keep staging out of search indexes
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 50M;

    # Frontend (Next.js) — staging web on 3012
    location / {
        proxy_pass http://localhost:3012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API backend — staging api on 8011
    location /api/ {
        proxy_pass http://localhost:8011/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Native chat WebSocket (before the generic /ws/ block)
    location /ws/chat {
        proxy_pass http://localhost:8011/ws/chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Voice-chat WebSocket (before the generic /ws/ block)
    location /ws/voice-chat {
        proxy_pass http://localhost:8011/ws/voice-chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Centrifugo realtime WebSocket.
    # NOTE: Centrifugo is not part of docker-compose.prod.yml, so staging has no
    # separate instance by default — this points at the shared prod Centrifugo
    # (8100). If you want fully isolated staging realtime, run a second Centrifugo
    # on another port and change 8100 below to it.
    location /ws/ {
        proxy_pass http://localhost:8100/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # MCP API server — staging on 3013
    location /mcp-api/ {
        proxy_pass http://localhost:3013/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastMCP server — staging on 8012
    location /fastmcp/ {
        proxy_pass http://localhost:8012/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MDT server — staging on 8091
    location /mdt/ {
        proxy_pass http://localhost:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flower — staging Celery dashboard on 5556 (same basic-auth file as prod)
    location /flower/ {
        auth_basic "Flower (staging)";
        auth_basic_user_file /etc/nginx/.flower_htpasswd;
        proxy_pass http://localhost:5556;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://localhost:8011/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
