services:
  embed:
    build: .
    image: pal-embed:latest
    container_name: pal-embed
    restart: unless-stopped          # always back up after crash / reboot
    ports:
      - "127.0.0.1:8080:8080"        # localhost-only; reach it from other APP05 services
    environment:
      - EMBED_MODEL_ID=google/embeddinggemma-300m   # matches the corpus (embed_log.txt)
      - HF_TOKEN=${HF_TOKEN}          # gated model: needs an accepted-license token
      - OMP_NUM_THREADS=4
      - HF_HOME=/cache
    volumes:
      - /data/apps/docmode/hf-cache:/cache        # model downloads once, persists
    mem_limit: 5g                     # leave headroom for Postgres/pgvector on 8 GB
    cpus: 4
