name: pal

services:
  # PostgreSQL database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: pal-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pal}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pal}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: pal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # FastAPI backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pal-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pal}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
      - uploads:/app/uploads
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # Next.js frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: pal-web
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
      NODE_ENV: development
    ports:
      - "3002:3000"
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  # MCP API server
  mcp-api:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: pal-mcp-api
    env_file: .env
    environment:
      PORT: 3001
      PAL_API_KEY: ${PAL_API_KEY:-pal-secret-key-12345}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pal}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./mcp-server:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Medical Data Toolkit
  mdt:
    build:
      context: ./mdt-source
      dockerfile: Dockerfile
    container_name: pal-mdt
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY} 
    ports:
      - "8090:8080"
    volumes:
      - ./loinc-kb-minimal:/data:ro
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  uploads:
