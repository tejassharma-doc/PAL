// App-level Gradle build script — configures how the PAL Health APK/AAB is compiled.
// This is the file Android developers will edit most often.

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native gradle plugin block.
 * hermesEnabled and newArchEnabled are inherited from gradle.properties.
 */
react {
    // JS bundle entrypoint (relative to project root)
    entryFile = file("../../index.js")

    // Uncomment to point at a custom Metro bundler host (e.g. dev machine IP):
    // bundleAssetName = "index.android.bundle"
    // bundleCommand = "ram-bundle"
}

android {
    namespace  "com.palhealth"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.palhealth"
        minSdk     rootProject.ext.minSdkVersion     // Android 7.0+
        targetSdk  rootProject.ext.targetSdkVersion  // Android 15
        versionCode 1
        versionName "1.0.0"

        // MultiDex required when method count > 65K (common with RN + libs)
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            // Debug keystore — pre-installed on every Android SDK installation.
            // For release builds, replace with your team's signing config.
            storeFile      file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword  "android"
            keyAlias       "androiddebugkey"
            keyPassword    "android"
        }
        // release {
        //   storeFile file(RELEASE_STORE_FILE)
        //   storePassword RELEASE_STORE_PASSWORD
        //   keyAlias RELEASE_KEY_ALIAS
        //   keyPassword RELEASE_KEY_PASSWORD
        // }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.debug   // Replace with signingConfigs.release for production
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }

    // Split APKs per ABI — reduces download size (arm64 for modern devices; x86_64 for emulators)
    splits {
        abi {
            enable    false          // Set true for production Play Store upload
            reset()
            include   "arm64-v8a", "x86_64"
            universalApk true       // Always produce a universal APK for testing
        }
    }

    packagingOptions {
        pickFirst "lib/x86/libc++_shared.so"
        pickFirst "lib/x86_64/libc++_shared.so"
        pickFirst "lib/armeabi-v7a/libc++_shared.so"
        pickFirst "lib/arm64-v8a/libc++_shared.so"
    }
}

dependencies {
    // Core Android
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.multidex:multidex:2.0.1"

    // React Native — the framework JAR is provided by the RN Gradle plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // Kotlin standard library
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
}

// NOTE: Autolinking for third-party native modules (document picker, image picker, etc.)
// is handled automatically by the React Native Gradle plugin via settings.gradle.
// No manual 'apply from' call is needed for React Native 0.76+.
