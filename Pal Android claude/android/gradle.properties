# Gradle build configuration for PAL Health Android app.
# These flags are read by Gradle at build time.

# ── JVM tuning ────────────────────────────────────────────────────────────────
# Increase heap to avoid OutOfMemory during large builds.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m

# Enable Gradle daemon for faster incremental builds.
org.gradle.daemon=true

# Parallelize independent module compilation.
org.gradle.parallel=true

# Cache build outputs between runs.
org.gradle.caching=true

# ── Android SDK ────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=true

# ── React Native: New Architecture ────────────────────────────────────────────
# Enables Hermes JS engine + Fabric renderer + TurboModules (JSI-based).
# Required for React Native 0.76+. Do NOT set to false — the app is built
# against the new arch; reverting would require rebuilding native bridges.
newArchEnabled=true

# ── React Native: Hermes JS engine ────────────────────────────────────────────
# Hermes gives significantly faster app startup and lower memory on Android.
hermesEnabled=true

# ── Kotlin ────────────────────────────────────────────────────────────────────
kotlin.code.style=official
