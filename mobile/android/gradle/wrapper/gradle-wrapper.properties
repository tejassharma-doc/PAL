# Gradle Wrapper configuration — pins the Gradle version used to build this project.
# When an Android developer runs ./gradlew, this file tells the wrapper which Gradle
# distribution to download automatically (no manual Gradle install needed).

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
