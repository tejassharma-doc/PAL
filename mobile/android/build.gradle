// Top-level Gradle build file — configuration shared across all sub-projects/modules.
// Do NOT put project-specific dependencies here; they belong in android/app/build.gradle.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion    = 24          // Android 7.0+ (covers 97% of active devices)
        compileSdkVersion = 35         // Android 15
        targetSdkVersion  = 35
        ndkVersion        = "26.1.10909125"  // React Native 0.76 template value
        kotlinVersion     = "1.9.25"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")          // version pinned by the React Native gradle plugin
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}


allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url("https://www.jitpack.io") }
    }
}

// Makes library modules evaluate after :app so the React Native plugin can set a
// namespace on autolinked libraries that lack one (tts, voice, onnxruntime).
// Same as the React Native 0.76 template.
apply plugin: "com.facebook.react.rootproject"
